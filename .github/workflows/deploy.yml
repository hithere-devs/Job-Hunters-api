name: Deploy prod

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to job-hunters-backend
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy via SSM
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-003077694d4d2d453 \
            --document-name AWS-RunShellScript \
            --comment "CI deploy Job Hunters API" \
            --parameters 'commands=["git config --system --add safe.directory /opt/job-hunters","/usr/local/bin/deploy-job-hunters"]' \
            --query 'Command.CommandId' \
            --output text)
          echo "command=$COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id i-003077694d4d2d453 \
              --query 'Status' \
              --output text)
            echo "status=$STATUS"
            case "$STATUS" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) 
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-003077694d4d2d453 --query 'StandardErrorContent' --output text
                exit 1
                ;;
            esac
            sleep 15
          done
          echo 'timed out waiting for SSM deploy'
          exit 1
